name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (prebuilt release, no brew)
        run: |
          curl -L -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q xcodegen.zip -d "$HOME/xcodegen_bin"
          echo "$HOME/xcodegen_bin/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen
        run: xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project AM4U2.xcodeproj \
            -scheme AM4U2 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AM4U2.app Payload/
          zip -qr AM4U2-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AM4U2-unsigned-ipa
          path: AM4U2-unsigned.ipa
